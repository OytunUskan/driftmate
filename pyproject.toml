[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driftmate"
version = "0.1.0"
description = "Detect Kubernetes/Helm component version drift and propose human-approved remediation via ChatOps."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyGithub>=1.59",
    "python-telegram-bot>=20.7",
    "docker>=6.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "ruamel.yaml>=0.19.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.21",
]

[project.scripts]
driftmate = "driftmate.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
